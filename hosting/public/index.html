<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>BlueGuard Buoy — Continue in app</title>
<style>
body{font-family:system-ui,Arial,sans-serif;background:#f2f7fa;color:#123048;margin:0;display:grid;place-items:center;min-height:100vh}
main{box-sizing:border-box;width:min(460px,calc(100% - 32px));padding:30px;background:#fff;border-radius:16px;box-shadow:0 5px 35px #102c4320}
h1{color:#08718b;margin-top:0}p{line-height:1.6}
button{width:100%;border:0;border-radius:10px;background:#08718b;color:#fff;font:600 1rem system-ui,sans-serif;padding:14px 20px;cursor:pointer}
button:focus-visible{outline:3px solid #e7ab29;outline-offset:3px}
[hidden]{display:none!important}.help{font-size:.9rem;color:#496477}
</style>
</head>
<body><main>
<h1>BlueGuard Buoy</h1>
<p id="message" aria-live="polite">Checking your secure email link with Firebase…</p>
<button id="open-blueguard" type="button" hidden disabled>Open BlueGuard Buoy</button>
<p id="help" class="help">This requires an internet connection. Please keep this page open.</p>
<p class="help">This page cannot verify accounts, reset passwords, or grant device access. Those actions are completed inside BlueGuard.</p>
</main>
<script type="module" src="/firebase-native-open.mjs"></script>
</body></html>
