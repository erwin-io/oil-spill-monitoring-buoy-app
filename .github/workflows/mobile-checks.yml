name: BlueWatch Mobile Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  install-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependency installation
        run: npm ci --no-audit --no-fund
      - name: Local validation script syntax
        run: node --check scripts/verify-local.mjs
      - name: Execute local mobile validation runner
        run: npm run verify:local -- --skip-install
