name: BlueWatch Mobile Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  install-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and resolve lockfile
        run: npm install --no-audit --no-fund
      - name: Structural checks
        run: npm test
      - name: Angular production build
        run: npm run build
      - name: Commit validated lockfile on main once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f package-lock.json
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: track validated npm lockfile [skip ci]"
            git push origin HEAD:main
          fi
      - name: Keep generated lockfile for reproducibility review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluewatch-generated-package-lock
          path: package-lock.json
          if-no-files-found: ignore
