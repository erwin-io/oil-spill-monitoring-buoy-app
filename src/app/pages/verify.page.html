<ion-header class="no-shadow">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button type="button" fill="clear" color="light"
        aria-label="Back to sign in" (click)="goLogin()">
        <ion-icon slot="icon-only" name="arrow-back" aria-hidden="true"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Verify email</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding verify-wait-page">
  <main class="verify-wait-layout">
    <section class="verify-wait-group" aria-labelledby="verify-wait-heading">
      <div class="verify-wait-illustration" aria-hidden="true">
        <svg viewBox="0 0 180 160" width="180" height="160"
          xmlns="http://www.w3.org/2000/svg" focusable="false">
          <circle cx="90" cy="80" r="73" fill="#eaf3ff"/>
          <circle cx="90" cy="80" r="62" fill="#f5faff"/>
          <path d="M42 57 Q42 49 50 49 H130 Q138 49 138 57 V112
                   Q138 120 130 120 H50 Q42 120 42 112 Z"
                fill="#ffffff" stroke="#0058db" stroke-width="4"/>
          <path d="M44 57 L90 91 L136 57" fill="none" stroke="#0058db"
                stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M44 115 L73 90 M136 115 L107 90" stroke="#c8dfff"
                stroke-width="3" stroke-linecap="round"/>
          <circle cx="134" cy="44" r="21" fill="#0cbb89"/>
          <path d="M125 44 L132 51 L144 37" fill="none" stroke="#ffffff"
                stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 32 L31 37 M149 130 L158 135" stroke="#7aacf6"
                stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="verify-wait-heading">Check your inbox</h1>
      <p class="verify-wait-description">
        We sent a verification link to your email. Open it in Gmail to
        complete verification securely inside BlueGuard Buoy.
      </p>
      <ion-button class="regular verify-resend-button" expand="block" fill="outline"
        [disabled]="busy" (click)="resend()">
        @if (busy) {
          <ion-spinner name="dots" aria-label="Resending verification email"></ion-spinner>
        } @else { Resend verification email }
      </ion-button>
      @if (message) {
        <ion-note class="verify-wait-message" role="status">{{ message }}</ion-note>
      }
    </section>
  </main>
</ion-content>
