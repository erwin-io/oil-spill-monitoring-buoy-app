<ion-header class="no-shadow">
  <ion-toolbar color="primary"><ion-title>Verify email</ion-title></ion-toolbar>
</ion-header>
<ion-content class="ion-padding page">
  <div class="wrap">
    <ion-card class="card no-shadow">
      <ion-card-header>
        <ion-card-title>Verify your email</ion-card-title>
        <ion-card-subtitle>Open your verification email, follow the link, then return here.</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <div class="fieldset">
          @if (message) { <ion-note class="form-error" role="status">{{ message }}</ion-note> }
          <ion-button class="regular" expand="block" [disabled]="busy" (click)="check()">
            @if (busy) { <ion-spinner name="dots" aria-label="Checking verification"></ion-spinner> }
            @else { I've verified my email }
          </ion-button>
          <ion-button class="regular" expand="block" fill="outline"
            [disabled]="busy" (click)="resend()">Resend verification email</ion-button>
        </div>
        <div class="link-row">
          <ion-button fill="clear" routerLink="/login">Back to sign in</ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
