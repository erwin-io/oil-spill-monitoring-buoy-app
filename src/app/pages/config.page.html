<ion-header class="no-shadow"><ion-toolbar color="primary"><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/buoys"></ion-back-button></ion-buttons><ion-title>Configuration</ion-title></ion-toolbar></ion-header><ion-content><div class="page"><p *ngIf="error" class="error">{{error}}</p><p>{{saved}}</p><div *ngIf="config as c" class="card"><p>Desired config version: {{c.configVersion}}</p><p *ngIf="!canEdit">Read-only access (VIEWER)</p><ion-input label="Sampling interval (minutes)" label-placement="stacked" fill="outline" type="number" [(ngModel)]="c.samplingIntervalMinutes" [readonly]="!canEdit"></ion-input><ion-input label="Measurement repeats" label-placement="stacked" fill="outline" type="number" [(ngModel)]="c.measurementRepeats" [readonly]="!canEdit"></ion-input><ion-input label="Settling time (seconds)" label-placement="stacked" fill="outline" type="number" [(ngModel)]="c.settleSeconds" [readonly]="!canEdit"></ion-input><ion-input label="Cleaning cycles" label-placement="stacked" fill="outline" type="number" [(ngModel)]="c.cleaningCycles" [readonly]="!canEdit"></ion-input><ion-input label="Maximum cleaning retries" label-placement="stacked" fill="outline" type="number" [(ngModel)]="c.maxCleaningRetries" [readonly]="!canEdit"></ion-input><ion-input label="Oil alert confidence threshold (0–1)" label-placement="stacked" fill="outline" type="number" [(ngModel)]="c.oilConfidenceThreshold" [readonly]="!canEdit"></ion-input><ion-input label="Low battery threshold (%)" label-placement="stacked" fill="outline" type="number" [(ngModel)]="c.lowBatteryThreshold" [readonly]="!canEdit"></ion-input><ion-button expand="block" *ngIf="canEdit" [disabled]="busy" (click)="save()">Save approved settings</ion-button></div></div></ion-content>
