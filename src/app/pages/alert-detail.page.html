<ion-header class="no-shadow"><ion-toolbar color="primary"><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/alerts"></ion-back-button></ion-buttons><ion-title>Alert details</ion-title></ion-toolbar></ion-header><ion-content><div class="page"><div *ngIf="error" role="alert"><p class="error">{{error}}</p><ion-button fill="outline" expand="block" [disabled]="busy" (click)="load()">Retry loading</ion-button></div><ng-container *ngIf="alert as a"><div class="card"><h2>{{a.type}}</h2><p>Severity: {{a.severity}}</p><p>Status: {{a.status}}</p><p>Buoy: <a [routerLink]="['/tabs/buoys',a.deviceId]">{{a.deviceId}}</a></p><p>Created: {{a.createdAt|date:'medium'}}</p><p>Reference: {{a.measurementId||'—'}}</p><p *ngIf="a.acknowledgedAt">Acknowledged: {{a.acknowledgedAt|date:'medium'}} · {{a.acknowledgedBy}}</p></div><ion-button expand="block" *ngIf="a.status==='OPEN'&&auth.profile()?.role!=='VIEWER'" [disabled]="busy" (click)="ack()">Acknowledge</ion-button></ng-container></div></ion-content>
