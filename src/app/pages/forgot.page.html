<ion-header class="no-shadow">
  <ion-toolbar color="primary">
    <ion-buttons slot="start"><ion-back-button defaultHref="/login"></ion-back-button></ion-buttons>
    <ion-title>Forgot password</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding page">
  <div class="wrap">
    <ion-card class="card no-shadow">
      <ion-card-header>
        <ion-card-title>Reset your password</ion-card-title>
        <ion-card-subtitle>Enter your account email. We'll send a secure link to reset your password.</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <form (ngSubmit)="reset()" class="fieldset" novalidate>
          <ion-input name="email" [(ngModel)]="email" type="email" label="Email"
            labelPlacement="stacked" fill="outline" placeholder="Enter your account email"
            autocomplete="email" inputmode="email" autocapitalize="off" [clearInput]="true">
          </ion-input>
          @if (message) { <ion-note class="form-error" role="status">{{ message }}</ion-note> }
          <ion-button class="regular" type="submit" expand="block" [disabled]="busy || !email.trim()">
            @if (busy) { <ion-spinner name="dots" aria-label="Requesting reset"></ion-spinner> }
            @else { Send reset link }
          </ion-button>
        </form>
        <div class="link-row">
          <ion-button fill="clear" routerLink="/login">Back to sign in</ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
