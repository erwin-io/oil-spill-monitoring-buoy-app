<ion-header class="no-shadow"><ion-toolbar color="primary"><ion-buttons slot="start"><ion-back-button defaultHref="/tabs/buoys"></ion-back-button></ion-buttons><ion-title>Subsystem health</ion-title></ion-toolbar></ion-header><ion-content><div class="page"><p *ngIf="error" class="error">{{error}}</p><div class="card" *ngIf="health as h"><p>Measured: {{h.measuredAt|date:'medium'}}</p><div class="health-row" *ngFor="let item of [['Battery',h.batteryPercent===undefined?'—':h.batteryPercent+'%'],['Voltage',h.batteryVoltage===undefined?'—':h.batteryVoltage+' V'],['Charging',h.charging===undefined?'—':h.charging?'Yes':'No'],['GSM',h.signalStrengthDbm===undefined?'—':h.signalStrengthDbm+' dBm'],['Storage',h.storage||'—'],['AS7341 sensor',h.sensor||'—'],['Sample pump',h.samplePump||'—'],['Wash pump',h.washPump||'—'],['Valve',h.valve||'—'],['Optical cell',h.cellStatus||'—'],['Queued uploads',h.pendingUploads===undefined?'—':h.pendingUploads]]"><span>{{item[0]}}</span><strong>{{item[1]}}</strong></div><p>Error codes: {{h.errorCodes?.join(', ')||'None reported'}}</p></div><div class="empty" *ngIf="!health">No device health snapshot available.</div></div></ion-content>
