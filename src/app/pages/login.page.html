<ion-content class="ion-padding"><div class="auth"><div class="brand"><h1>BlueWatch</h1><p>Oil Spill Monitoring Buoys</p></div><div class="panel"><h2>Sign in</h2><p class="hint">Monitor raw-seawater buoy conditions securely.</p><ion-input label="Email" label-placement="stacked" type="email" fill="outline" [(ngModel)]="email"></ion-input><ion-input label="Password" label-placement="stacked" type="password" fill="outline" [(ngModel)]="password"></ion-input><p class="error" role="alert">{{error}}</p><ion-button expand="block" [disabled]="busy || !email || !password" (click)="login()">Sign in</ion-button><p><a routerLink="/forgot-password">Forgot password?</a></p><p>New to BlueWatch? <a routerLink="/register">Create an account</a></p></div></div></ion-content>
