<ion-header class="no-shadow"><ion-toolbar color="primary"><ion-title>Notifications</ion-title>
<ion-buttons slot="end"><ion-button color="light" fill="clear" aria-label="Mark all notifications as read" title="Mark all as read" [disabled]="loading||marking||!unreadCount" (click)="markAll()"><ion-icon slot="icon-only" name="checkmark-done-outline"></ion-icon></ion-button></ion-buttons>
</ion-toolbar></ion-header>
<ion-content>
 <ion-refresher slot="fixed" (ionRefresh)="load($event)"><ion-refresher-content></ion-refresher-content></ion-refresher>
 <div class="page">
  <p class="hint">Unread: {{unreadCount}} · Open incidents: {{openCount}}</p>
  <p *ngIf="loading&&!loadedOnce">Loading notifications...</p>
  <p *ngIf="loading&&loadedOnce" class="hint" role="status">Refreshing notifications…</p>
  <div *ngIf="error" role="alert"><p class="error">{{error}}</p><ion-button expand="block" fill="outline" (click)="load()">Retry loading</ion-button></div>
  <div *ngFor="let a of items" class="card tap" [routerLink]="['/tabs/alerts',a.id]">
   <div class="row"><strong>{{a.type}}</strong><span class="badge">{{a.severity}}</span></div>
   <p>{{nameOf(a)}} ({{a.deviceId}}) · {{a.createdAt|date:'medium'}}</p>
   <p class="hint">{{a.unread===true?'Unread · ':''}}{{a.status}}</p>
  </div>
  <div class="blueguard-empty-layout" *ngIf="(!loading||loadedOnce)&&!items.length&&!error" role="status">
    <app-empty-state kind="alerts" title="You're all caught up"
      description="Oil spill alerts and important buoy notifications will appear here."></app-empty-state>
  </div>
  <ion-button *ngIf="cursor" expand="block" fill="outline" [disabled]="loading" (click)="more()">Load more</ion-button>
 </div>
</ion-content>
