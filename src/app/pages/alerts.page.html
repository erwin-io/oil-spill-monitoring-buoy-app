<ion-header class="no-shadow"><ion-toolbar color="primary"><ion-title>Alerts inbox</ion-title></ion-toolbar></ion-header><ion-content><ion-refresher slot="fixed" (ionRefresh)="load($event)"><ion-refresher-content></ion-refresher-content></ion-refresher><div class="page"><ion-select label="Status" label-placement="stacked" fill="outline" interface="alert" [interfaceOptions]="{ header: 'Status' }" [(ngModel)]="filter"><ion-select-option value="ALL">All</ion-select-option><ion-select-option value="OPEN">Open</ion-select-option><ion-select-option value="ACKNOWLEDGED">Acknowledged</ion-select-option><ion-select-option value="RESOLVED">Resolved</ion-select-option></ion-select><p *ngIf="loading">Loading alerts...</p><div *ngIf="error" role="alert"><p class="error">{{error}}</p><ion-button expand="block" fill="outline" (click)="load()">Retry loading</ion-button></div><div *ngFor="let a of shown" class="card tap" [routerLink]="['/tabs/alerts',a.id]"><div class="row"><strong>{{a.type}}</strong><span class="badge">{{a.severity}}</span></div><p>{{nameOf(a)}} ({{a.deviceId}}) · {{a.createdAt|date:'medium'}}</p><p class="hint">{{a.unread===true?'Unread · ':''}}{{a.status==='OPEN'?'Needs acknowledgement':a.status}}</p></div><div class="empty" *ngIf="!loading&&!shown.length">No alerts available.</div></div></ion-content>
