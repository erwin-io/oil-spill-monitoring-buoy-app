<ion-header><ion-toolbar><ion-title>Alerts inbox</ion-title></ion-toolbar></ion-header><ion-content><ion-refresher slot="fixed" (ionRefresh)="load($event)"><ion-refresher-content></ion-refresher-content></ion-refresher><div class="page"><ion-select label="Status" label-placement="stacked" [(ngModel)]="filter"><ion-select-option value="ALL">All</ion-select-option><ion-select-option value="OPEN">Open</ion-select-option><ion-select-option value="ACKNOWLEDGED">Acknowledged</ion-select-option><ion-select-option value="RESOLVED">Resolved</ion-select-option></ion-select><p *ngIf="loading">Loading alerts...</p><p class="error" *ngIf="error">{{error}}</p><div *ngFor="let a of shown" class="card tap" [routerLink]="['/tabs/alerts',a.id]"><div class="row"><strong>{{a.type}}</strong><span class="badge">{{a.severity}}</span></div><p>{{a.deviceId}} · {{a.createdAt|date:'medium'}}</p><p class="hint">{{a.status}}</p></div><div class="empty" *ngIf="!loading&&!shown.length">No alerts available.</div></div></ion-content>
