<ion-content class="ion-padding"><div class="auth"><div class="brand"><h1>BlueWatch</h1></div><div class="panel"><h2>Create account</h2><ion-input label="Email" label-placement="stacked" fill="outline" type="email" [(ngModel)]="email"></ion-input><ion-input label="Password (6+ characters)" label-placement="stacked" fill="outline" type="password" [(ngModel)]="password"></ion-input><p role="alert">{{message}}</p><ion-button expand="block" [disabled]="busy||!email||password.length<6" (click)="submit()">Register</ion-button><a routerLink="/login">Back to login</a></div></div></ion-content>
